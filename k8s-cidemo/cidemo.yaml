apiVersion: v1
kind: Namespace
metadata:
  name: cidemo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: cidemo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: cidemo
  labels:
    app: mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:5
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-data
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: cidemo
spec:
  selector:
    app: mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-express-mongoose-demo
  namespace: cidemo
  labels:
    app: node-express-mongoose-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-express-mongoose-demo
  template:
    metadata:
      labels:
        app: node-express-mongoose-demo
    spec:
      containers:
        - name: app
          image: majid04/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: MONGODB_URL
              value: mongodb://mongo:27017/node-express-mongoose-demo
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: node-express-mongoose-demo
  namespace: cidemo
spec:
  type: NodePort
  selector:
    app: node-express-mongoose-demo
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30080
